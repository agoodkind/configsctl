tofu:
  workspaces_dir: workspaces
  env_key_prefix: fixture_env_
  lock_targets:
    workspaces/legacy:
      lock_free_types: [terraform_data]
      module_hosts:
        terraform_data.original: synthetic-lock-host
      lock_endpoints:
        synthetic-lock-host:
          address: 127.0.0.1
    workspaces/application:
      lock_free_types: [terraform_data]
      module_hosts:
        terraform_data.renamed: synthetic-lock-host
      lock_endpoints:
        synthetic-lock-host:
          address: 127.0.0.1
  credentials:
    workspaces/MIGRATION_CREDENTIAL_SELECTOR:
      lock_host: synthetic-lock-host
      username_variable: deployment_user
      password_variable: deployment_password
      dell:
        endpoint: https://127.0.0.1:1
        rotator_user: rotator
        rotator_password_key: vault_migration_rotator
        account_id: "3"
        username: configsctl
        read_paths:
          - /redfish/v1/Managers/iDRAC.Embedded.1
