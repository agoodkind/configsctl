name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      binary: configsctl
      require_darwin_codesign: true
    secrets: inherit

  # The root publish job downloads all release-* artifacts. The overlay job
  # waits for the root release to finish before creating its matching archives,
  # which keeps them out of the configsctl release. The overlay job publishes
  # a separate release under the tag set by the overlay Makefile.
  docker-overlay:
    needs: release
    uses: agoodkind/go-makefile/.github/workflows/_release.yml@main
    permissions:
      contents: write
      id-token: write
      attestations: write
    with:
      binary: terraform-provider-docker
      require_darwin_codesign: true
      darwin_runner: macos-15
      working_directory: docker-overlay
    secrets: inherit
